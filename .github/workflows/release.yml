# Release workflow for Schließfach-Manager
#
# This workflow handles:
# - Publishing to crates.io when a new version tag is pushed
# - Building release binaries for multiple platforms
# - Creating GitHub releases with pre-built binaries
#
# To publish a new release:
# 1. Update version in Cargo.toml
# 2. Commit the change: git commit -am "Release v2.0.1"
# 3. Create and push a tag: git tag v2.0.1 && git push origin v2.0.1

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-releases like v2.0.0-beta.1

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: schliessfach-manager

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) doesn't match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: There are uncommitted changes"
            git status
            exit 1
          fi

  # Publish to crates.io
  publish-crates-io:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --dry-run
          cargo publish

  # Build release binaries for multiple platforms
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: schliessfach-manager
            asset_name: schliessfach-manager-linux-x86_64
          
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: schliessfach-manager
            asset_name: schliessfach-manager-linux-aarch64
            cross: true
          
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: schliessfach-manager
            asset_name: schliessfach-manager-macos-x86_64
          
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: schliessfach-manager
            asset_name: schliessfach-manager-macos-aarch64
          
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: schliessfach-manager.exe
            asset_name: schliessfach-manager-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross
      
      - name: Build binary (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Build binary (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
      
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  # Create GitHub release with all binaries
  create-release:
    name: Create GitHub Release
    needs: [validate, build-binaries, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version if CHANGELOG.md exists
          if [ -f CHANGELOG.md ]; then
            VERSION=${{ needs.validate.outputs.version }}
            CHANGELOG=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Release v${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.validate.outputs.version }}
          body: |
            # Schließfach-Manager v${{ needs.validate.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### From crates.io
            ```bash
            cargo install schliessfach-manager
            ```
            
            ### Pre-built binaries
            Download the appropriate binary for your platform below.
            
            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux | x86_64 | `schliessfach-manager-linux-x86_64.tar.gz` |
            | Linux | ARM64 | `schliessfach-manager-linux-aarch64.tar.gz` |
            | macOS | x86_64 | `schliessfach-manager-macos-x86_64.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `schliessfach-manager-macos-aarch64.tar.gz` |
            | Windows | x86_64 | `schliessfach-manager-windows-x86_64.zip` |
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
