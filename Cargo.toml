[package]
name = "schliessfach-manager"
version = "2.0.0"
edition = "2021"
authors = ["DJL Foundation"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
unicode-width = "0.1"
directories = "5.0"
csv = "1.3"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
