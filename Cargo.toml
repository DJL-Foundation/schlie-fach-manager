[package]
name = "schliessfach-manager"
version = "2.1.0"
edition = "2021"
authors = ["DJL Foundation"]
description = "A comprehensive terminal-based locker management system (Schließfach-Manager) for schools and institutions"
license = "MIT"
repository = "https://github.com/DJL-Foundation/schlie-fach-manager"
homepage = "https://github.com/DJL-Foundation/schlie-fach-manager"
documentation = "https://docs.rs/schliessfach-manager"
readme = "README.md"
keywords = ["locker", "management", "tui", "school", "rental"]
categories = ["command-line-utilities", "database"]
rust-version = "1.75"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
unicode-width = "0.1"
directories = "5.0"
csv = "1.3"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Documentation settings for docs.rs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
