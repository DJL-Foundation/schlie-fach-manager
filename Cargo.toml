[package]
name = "schliessfach-manager"
version = "2.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
unicode-width = "0.1"
directories = "5.0"
csv = "1.3"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.13"
